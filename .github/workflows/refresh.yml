name: Refresh dashboard data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate dashboard data
        run: python3 generate_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hyperliquid_funding_dashboard.html paper_positions.json edge_watch_snapshot.json
          git diff --staged --quiet || git commit -m "Auto-refresh dashboard data [skip ci]"
          git push
